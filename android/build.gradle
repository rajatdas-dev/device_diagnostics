group 'dev.diagnostics.device_diagnostics'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories { google(); mavenCentral() }
    dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
}
rootProject.allprojects { repositories { google(); mavenCentral() } }
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android { namespace 'dev.diagnostics.device_diagnostics'; compileSdk 35; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = '17' } }
