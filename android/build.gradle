package android

group 'dev.diagnostics.device_diagnostics'
version '1.0-SNAPSHOT'

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.diagnostics.device_diagnostics'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget =
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
