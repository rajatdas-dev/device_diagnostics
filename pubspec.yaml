name: device_diagnostics
description: A Flutter package for opt-in device diagnostics, performance monitoring, network instrumentation, and PDF diagnostic reports.
version: 0.1.0

homepage: https://github.com/rajatdas-dev/device_diagnostics
repository: https://github.com/rajatdas-dev/device_diagnostics
issue_tracker: https://github.com/rajatdas-dev/device_diagnostics/issues

topics:
  - diagnostics
  - performance
  - monitoring
  - flutter
  - debugging

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.diagnostics.device_diagnostics
        pluginClass: DeviceDiagnosticsPlugin
      ios:
        pluginClass: DeviceDiagnosticsPlugin
